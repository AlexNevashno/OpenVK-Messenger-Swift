name: OpenVK Messenger
options:
  bundleIdPrefix: com.alexs.openvk
  createIntermediateGroups: true
  xcodeVersion: "15.0"

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "12.0"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ARCHS: "$(ARCHS_STANDARD)"
    ONLY_ACTIVE_ARCH: NO

packages:
  Lottie:
    url: https://github.com/airbnb/lottie-spm.git
    from: 4.4.3

targets:
  OpenVK Messenger:
    type: application
    platform: macOS
    deploymentTarget: "12.0"
    dependencies:
      - package: Lottie
    sources:
      - path: Sources/OpenVKMessenger
      - path: Assets.xcassets
      - path: AppIcon.icns
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexs.openvk.messenger
        PRODUCT_NAME: "OpenVK Messenger"
        INFOPLIST_KEY_CFBundleDisplayName: "OpenVK Messenger"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
        INFOPLIST_KEY_CFBundleIconFile: AppIcon
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_PREVIEWS: YES
        ENABLE_HARDENED_RUNTIME: NO

  OpenVK Messenger iOS:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    dependencies:
      - package: Lottie
    sources:
      - path: Sources/OpenVKMessenger
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexs.openvk.messenger.ios
        PRODUCT_NAME: "OpenVK Messenger"
        INFOPLIST_KEY_CFBundleDisplayName: "OpenVK Messenger"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Доступ к фото необходим для отправки изображений и видео."
        INFOPLIST_KEY_NSCameraUsageDescription: "Доступ к камере необходим для съемки фото и видео."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Доступ к микрофону необходим для голосовых сообщений."
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIBackgroundModes: "audio fetch remote-notification processing"
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
